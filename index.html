<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>microcatalog</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-box" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#b91c1c;color:#fff;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;z-index:9999;max-height:50vh;overflow:auto;"></div>
    <script>
      var errorBox = document.getElementById('error-box');
      function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent += msg + '\\n';
      }
      window.onerror = function(msg, url, line, col, err) {
        var text = 'Error: ' + msg + ' at ' + url + ':' + line + ':' + col;
        if (err && err.stack) text += '\\n' + err.stack;
        showError(text);
        console.error(text);
      };
      window.onunhandledrejection = function(e) {
        var text = 'Unhandled: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
        showError(text);
        console.error(text);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
